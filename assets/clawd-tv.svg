<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="tvtitle">
<title id="tvtitle">Clawd, the Claude Code mascot, bouncing around an old TV screen</title>
<defs>
  <clipPath id="scr"><rect x="70" y="96" width="410" height="308" rx="26"/></clipPath>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".2"/></pattern>
  <radialGradient id="vig" cx=".5" cy=".5" r=".72">
    <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/>
  </radialGradient>
</defs>
<style>
  .osd { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #E8E6DC; opacity: .55; letter-spacing: 1px; }
  .lbl { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; fill: #6B6960; letter-spacing: 5px; }
  .flick { animation: flick 6s steps(1) infinite; }
  .led { animation: led 2.4s ease-in-out infinite; }
  @keyframes flick { 0%, 96% { opacity: 0; } 97% { opacity: .06; } 98% { opacity: 0; } 99% { opacity: .04; } }
  @keyframes led { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .flick, .led { animation: none; } }
</style>
<!-- antenna -->
<line x1="275" y1="62" x2="215" y2="10" stroke="#2E2D2A" stroke-width="4" stroke-linecap="round"/>
<line x1="305" y1="62" x2="375" y2="16" stroke="#2E2D2A" stroke-width="4" stroke-linecap="round"/>
<circle cx="215" cy="10" r="6" fill="#2E2D2A"/><circle cx="375" cy="16" r="6" fill="#2E2D2A"/>
<rect x="255" y="56" width="70" height="16" rx="8" fill="#1C1B19" stroke="#2E2D2A" stroke-width="2"/>
<!-- body -->
<rect x="30" y="66" width="580" height="370" rx="38" fill="#1C1B19" stroke="#2E2D2A" stroke-width="2"/>
<rect x="100" y="436" width="44" height="22" rx="6" fill="#1C1B19" stroke="#2E2D2A" stroke-width="2"/>
<rect x="496" y="436" width="44" height="22" rx="6" fill="#1C1B19" stroke="#2E2D2A" stroke-width="2"/>
<!-- screen -->
<rect x="60" y="86" width="430" height="328" rx="32" fill="#0E0E0D" stroke="#2E2D2A" stroke-width="2"/>
<g clip-path="url(#scr)">
  <rect x="70" y="96" width="410" height="308" fill="#0A0A09"/>
  <text x="92" y="126" class="osd">CH 03</text>
  <text x="458" y="126" text-anchor="end" class="osd">▶ CLAUDE CODE</text>
  <g transform="translate(84, 132)">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;286 0;0 0" dur="10.6s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 198;0 0" dur="7.4s" repeatCount="indefinite"/><rect x="12" y="0" width="72" height="12" fill="#D97757"/><rect x="12" y="12" width="12" height="12" fill="#D97757"/><rect x="30" y="12" width="36" height="12" fill="#D97757"/><rect x="72" y="12" width="12" height="12" fill="#D97757"/><rect x="0" y="24" width="96" height="12" fill="#D97757"/><rect x="12" y="36" width="72" height="12" fill="#D97757"/><rect x="24" y="12" width="6" height="12" fill="#141413"><animate attributeName="fill" values="#141413;#D97757;#141413" keyTimes="0;0.94;0.98" calcMode="discrete" dur="4s" repeatCount="indefinite"/></rect><rect x="66" y="12" width="6" height="12" fill="#141413"><animate attributeName="fill" values="#141413;#D97757;#141413" keyTimes="0;0.94;0.98" calcMode="discrete" dur="4s" repeatCount="indefinite"/></rect><rect x="18" y="48" width="6" height="12" fill="#D97757"><animate attributeName="height" values="12;6" calcMode="discrete" dur="0.5s" repeatCount="indefinite"/></rect><rect x="30" y="48" width="6" height="12" fill="#D97757"><animate attributeName="height" values="6;12" calcMode="discrete" dur="0.5s" repeatCount="indefinite"/></rect><rect x="60" y="48" width="6" height="12" fill="#D97757"><animate attributeName="height" values="12;6" calcMode="discrete" dur="0.5s" repeatCount="indefinite"/></rect><rect x="72" y="48" width="6" height="12" fill="#D97757"><animate attributeName="height" values="6;12" calcMode="discrete" dur="0.5s" repeatCount="indefinite"/></rect></g></g>
  </g>
  <rect x="70" y="96" width="410" height="308" fill="url(#scan)"/>
  <rect x="70" y="96" width="410" height="308" fill="url(#vig)"/>
  <rect class="flick" x="70" y="96" width="410" height="308" fill="#E8E6DC" opacity="0"/>
</g>
<!-- controls -->
<circle cx="540" cy="146" r="26" fill="#242320" stroke="#2E2D2A" stroke-width="2"/>
<line x1="540" y1="146" x2="540" y2="126" stroke="#6B6960" stroke-width="3" stroke-linecap="round"/>
<circle cx="540" cy="226" r="20" fill="#242320" stroke="#2E2D2A" stroke-width="2"/>
<line x1="540" y1="226" x2="553" y2="214" stroke="#6B6960" stroke-width="3" stroke-linecap="round"/>
<rect x="508" y="290" width="64" height="5" rx="2.5" fill="#2E2D2A"/><rect x="508" y="304" width="64" height="5" rx="2.5" fill="#2E2D2A"/><rect x="508" y="318" width="64" height="5" rx="2.5" fill="#2E2D2A"/><rect x="508" y="332" width="64" height="5" rx="2.5" fill="#2E2D2A"/><rect x="508" y="346" width="64" height="5" rx="2.5" fill="#2E2D2A"/><rect x="508" y="360" width="64" height="5" rx="2.5" fill="#2E2D2A"/>
<circle class="led" cx="540" cy="394" r="5" fill="#D97757"/>
<text x="275" y="430" text-anchor="middle" class="lbl">CLAWD·TV</text>
</svg>
