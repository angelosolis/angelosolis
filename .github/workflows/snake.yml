name: Generate snake animation

on:
  schedule: # every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: generate snake.svg (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#4F46E5&color_dots=#ebedf0,#c7d2fe,#a5b4fc,#818cf8,#4f46e5
            dist/snake-dark.svg?palette=github-dark&color_snake=#A5B4FC&color_dots=#161b22,#312e81,#4338ca,#6366f1,#a5b4fc

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
