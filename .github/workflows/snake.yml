name: Generate snake animation

on:
  schedule: # every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: generate snake.svg (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # SNAKE_TOKEN = personal token (read:user) so private contributions show; falls back to the repo token
          github_token: ${{ secrets.SNAKE_TOKEN || github.token }}
          outputs: |
            dist/snake.svg?color_snake=#141413&color_dots=#eeece6,#f2c9b6,#e9a283,#d97757,#a8492b
            dist/snake-dark.svg?palette=github-dark&color_snake=#E8E6DC&color_dots=#1c1b19,#4a2c21,#7a4330,#b35e3f,#e8916d

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
